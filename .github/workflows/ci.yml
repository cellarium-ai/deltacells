# Lint, type check and test on every push to main and every pull request against it.
# Building the package compiles the C extension, which needs libzstd (headers and library).

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Lint check
      run: make lint

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: pip
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libzstd-dev
        python -m pip install --upgrade pip
        pip install .[test]
    - name: Check types
      run: make typecheck

  test:
    needs: [lint, mypy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
        - os: macos-latest
          python-version: "3.12"

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install libzstd (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev
    - name: Install libzstd (macOS)
      if: runner.os == 'macOS'
      run: brew install zstd
    - name: Install dependencies
      # CPU-only torch first, so that the (large) CUDA build is not pulled in; the extras are what the tests that
      # would otherwise be skipped need
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install .[test,torch,h5ad,obs,gcs]
    - name: Test with pytest
      run: make test
    - name: Test dataloader example
      run: make test-dataloader
